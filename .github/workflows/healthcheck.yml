name: Health check

# Pings the live site on a schedule. If it's ever unreachable or returns a
# non-2xx/3xx status, this job fails — and GitHub emails the repo owner.
# Set the site URL once: repo → Settings → Secrets and variables → Actions →
# Variables → New variable → name SITE_URL, value https://sujaygopal.com

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the site is up
        run: |
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then
            echo "SITE_URL variable not set yet — skipping. Add it in repo Variables."
            exit 0
          fi
          echo "Pinging $URL"
          code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
          echo "HTTP status: $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::error::Site check failed with HTTP $code"
            exit 1
          fi
          echo "Site is healthy."
