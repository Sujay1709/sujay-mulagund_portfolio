server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets on the fly.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Vite writes content-hashed filenames to /assets, so cache them forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: unknown paths return index.html (client renders the page).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
